<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1622" media="(prefers-color-scheme: dark)">
<title>Rumah Kanak-Kanak Triniti - Donation Wishlist</title>
<meta name="description" content="What the children at Rumah Kanak-Kanak Triniti need right now, and the two simple ways to give: send an item from the list, or donate money.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="index">
<a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
<div id="site-header"></div>

<main id="main" tabindex="-1">

  <section class="hero">
    <div class="shell">
      <div class="hero__media">
        <div class="ph ph--image" data-cfg-img="content.hero.image" data-cfg-alt="content.hero.imageAlt" data-ph-size="1920x1080"></div>
      </div>
      <div class="hero__content">
        <h1 class="hero__title ph ph--text" data-cfg="content.hero.title"></h1>
        <p class="hero__subtitle ph ph--text" data-cfg="content.hero.subtitle"></p>
        <div class="hero__actions">
          <a class="btn btn--primary" id="hero-cta" href="donate.html" data-cfg="content.hero.ctaLabel"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="cards5">
    <div class="shell">
      <div class="cards5__grid">

        <a class="card-link" data-cfg-href="content.cards.0.href">
          <span class="card-link__icon" aria-hidden="true"></span>
          <h2 class="card-link__title" data-i18n="card.lendHand"></h2>
          <p class="card-link__body ph ph--text" data-cfg="content.cards.0.body"></p>
        </a>

        <a class="card-link" data-cfg-href="content.cards.1.href">
          <span class="card-link__icon" aria-hidden="true"></span>
          <h2 class="card-link__title" data-i18n="card.sponsorChild"></h2>
          <p class="card-link__body ph ph--text" data-cfg="content.cards.1.body"></p>
        </a>

        <a class="card-link" data-cfg-href="content.cards.2.href">
          <span class="card-link__icon" aria-hidden="true"></span>
          <h2 class="card-link__title" data-i18n="card.volunteer"></h2>
          <p class="card-link__body ph ph--text" data-cfg="content.cards.2.body"></p>
        </a>

        <a class="card-link" data-cfg-href="content.cards.3.href">
          <span class="card-link__icon" aria-hidden="true"></span>
          <h2 class="card-link__title" data-i18n="card.giftOfLove"></h2>
          <p class="card-link__body ph ph--text" data-cfg="content.cards.3.body"></p>
        </a>

        <a class="card-link" data-cfg-href="content.cards.4.href">
          <span class="card-link__icon" aria-hidden="true"></span>
          <h2 class="card-link__title" data-i18n="card.donateForUs"></h2>
          <p class="card-link__body ph ph--text" data-cfg="content.cards.4.body"></p>
        </a>

      </div>
    </div>
  </section>

  <section class="section" id="about">
    <div class="shell">
      <div class="split">
        <div class="split__media">
          <div class="ph ph--image" data-cfg-img="content.about.image" data-cfg-alt="content.about.imageAlt" data-ph-size="1200x900"></div>
        </div>
        <div class="split__body">
          <h2 class="section-title" data-i18n="about.title"></h2>
          <p class="ph ph--text" data-cfg="content.about.body"></p>
          <div class="facts">
            <div class="fact">
              <p class="fact__label" data-i18n="about.founded"></p>
              <p class="fact__value" data-cfg="content.about.founded"></p>
            </div>
            <div class="fact">
              <p class="fact__label" data-i18n="about.serves"></p>
              <p class="fact__value" data-cfg="content.about.residents"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="shell">
      <div class="split">
        <div class="split__media">
          <div class="ph ph--image" data-cfg-img="content.programs.0.image" data-cfg-alt="content.programs.0.imageAlt" data-ph-size="1200x900"></div>
        </div>
        <div class="split__body">
          <h2 class="section-title ph ph--text" data-cfg="content.programs.0.title"></h2>
          <p class="ph ph--text" data-cfg="content.programs.0.body"></p>
          <p>
            <a class="btn btn--ghost" data-cfg-href="content.programs.0.linkHref" data-cfg="content.programs.0.linkLabel"></a>
          </p>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="shell">
      <div class="split split--reverse">
        <div class="split__media">
          <div class="ph ph--image" data-cfg-img="content.programs.1.image" data-cfg-alt="content.programs.1.imageAlt" data-ph-size="1200x900"></div>
        </div>
        <div class="split__body">
          <h2 class="section-title ph ph--text" data-cfg="content.programs.1.title"></h2>
          <p class="ph ph--text" data-cfg="content.programs.1.body"></p>
          <p>
            <a class="btn btn--ghost" data-cfg-href="content.programs.1.linkHref" data-cfg="content.programs.1.linkLabel"></a>
          </p>
        </div>
      </div>
    </div>
  </section>

  <section class="section wishlist" id="wishlist">
    <div class="shell">
      <div class="section-head">
        <h2 class="section-title" data-i18n="nav.wishlist"></h2>
      </div>

      <div class="controls">
        <div class="field">
          <label class="field__label sr-only" for="search-input" data-i18n="controls.searchPlaceholder"></label>
          <input class="input" type="search" id="search-input" autocomplete="off" data-i18n-placeholder="controls.searchPlaceholder">
        </div>
        <div class="field">
          <label class="field__label" for="filter-category" data-i18n="controls.filterCategory"></label>
          <span class="select-wrap">
            <select class="select" id="filter-category"></select>
          </span>
        </div>
        <div class="field">
          <label class="field__label" for="filter-status" data-i18n="controls.filterStatus"></label>
          <span class="select-wrap">
            <select class="select" id="filter-status"></select>
          </span>
        </div>
        <div class="field">
          <label class="field__label" for="sort-select" data-i18n="controls.sort"></label>
          <span class="select-wrap">
            <select class="select" id="sort-select"></select>
          </span>
        </div>
        <p class="controls__count" id="results-count" aria-live="polite"></p>
      </div>

      <div id="wishlist-grid" class="grid"></div>

      <div class="state state--loading" id="loading-state">
        <span class="spinner" aria-hidden="true"></span>
        <p class="state__body" data-i18n="loading"></p>
      </div>

      <div class="state" id="empty-state" hidden>
        <svg class="state__icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path d="M21 6.5h-9A5.5 5.5 0 0 0 6.5 12v9A5.5 5.5 0 0 0 12 26.5h9A5.5 5.5 0 0 0 26.5 21v-9A5.5 5.5 0 0 0 21 6.5Z" fill="none" stroke="currentColor" stroke-width="2.6"/>
          <path d="M36 22h-9A5.5 5.5 0 0 0 21.5 27.5v9A5.5 5.5 0 0 0 27 42h9a5.5 5.5 0 0 0 5.5-5.5v-9A5.5 5.5 0 0 0 36 22Z" fill="none" stroke="currentColor" stroke-width="2.6"/>
        </svg>
        <h3 class="state__title" data-i18n="empty.title"></h3>
        <p class="state__body" data-i18n="empty.body"></p>
        <button class="btn btn--ghost" type="button" id="reset-filters" data-i18n="empty.reset"></button>
      </div>

      <div class="state state--error" id="error-state" hidden>
        <h3 class="state__title" data-i18n="error.title"></h3>
        <p class="state__body" id="error-text"></p>
        <button class="btn btn--primary" type="button" id="retry-button" data-i18n="error.retry"></button>
      </div>
    </div>
  </section>

  <section class="donate-band" id="donate">
    <div class="shell donate-band__inner">
      <h2 class="donate-band__title ph ph--text" data-cfg="content.donation.title"></h2>
      <p class="donate-band__intro ph ph--text" data-cfg="content.donation.intro"></p>

      <div id="amounts" class="amounts"></div>

      <div class="other-amount" hidden>
        <input class="other-amount__field" id="other-amount" type="text" inputmode="numeric" autocomplete="off" data-i18n-aria="placeholder.customAmount" data-i18n-placeholder="placeholder.customAmount">
      </div>

      <div class="donate-band__cta">
        <a class="btn btn--on-dark" id="donate-now" href="donate.html?amount=10" data-i18n="donate.now"></a>
      </div>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
