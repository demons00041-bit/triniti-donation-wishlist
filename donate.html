<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1622" media="(prefers-color-scheme: dark)">
<title>Ways to donate | Rumah Kanak-Kanak Triniti</title>
<meta name="description" content="Three ways to give to Rumah Kanak-Kanak Triniti: scan the e-wallet QR, pay on the bank hosted page, or make a direct bank transfer. Nothing has to be filled in to pay.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="donate">
<a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
<div id="site-header"></div>

<main id="main" tabindex="-1">

  <section class="page-hero">
    <div class="shell">
      <h1 class="page-hero__title" data-i18n="donatePage.title"></h1>
      <p class="page-hero__subtitle" data-cfg="content.donation.pageSubtitle"></p>
    </div>
  </section>

  <section class="section donate-flow" id="donate-flow">
    <div class="shell">

      <ol class="steps-nav" id="steps-nav" data-i18n-aria="steps.navAria">
        <li class="steps-nav__item is-current" data-step="method" aria-current="step"><span class="steps-nav__num">1</span><span class="steps-nav__label" data-i18n="step.method"></span></li>
        <li class="steps-nav__item" data-step="amount"><span class="steps-nav__num">2</span><span class="steps-nav__label" data-i18n="step.amount"></span></li>
        <li class="steps-nav__item" data-step="info"><span class="steps-nav__num">3</span><span class="steps-nav__label" data-i18n="step.info"></span></li>
        <li class="steps-nav__item" data-step="pay"><span class="steps-nav__num">4</span><span class="steps-nav__label" data-i18n="step.pay"></span></li>
        <li class="steps-nav__item" data-step="done"><span class="steps-nav__num">5</span><span class="steps-nav__label" data-i18n="step.done"></span></li>
      </ol>

      <div class="step-panel" data-panel="method" id="panel-method">
        <h2 class="step-title" data-i18n="step.method"></h2>
        <div class="method-grid">
          <button class="method-card" type="button" data-method="qr" aria-pressed="false">
            <span class="method-card__title" data-i18n="pay.qrTitle"></span>
            <span class="method-card__note" data-i18n="method.qrNote"></span>
          </button>
          <button class="method-card" type="button" data-method="hosted" aria-pressed="false">
            <span class="method-card__title" data-i18n="pay.hostedTitle"></span>
            <span class="method-card__note" data-i18n="method.hostedNote"></span>
          </button>
          <button class="method-card" type="button" data-method="transfer" aria-pressed="false">
            <span class="method-card__title" data-i18n="otherWays.bankTitle"></span>
            <span class="method-card__note" data-i18n="method.transferNote"></span>
          </button>
        </div>
        <div class="flow-nav">
          <button class="btn btn--primary" type="button" id="flow-method-next" data-i18n="flow.next" disabled></button>
        </div>
      </div>

      <div class="step-panel" data-panel="amount" id="panel-amount" hidden>
        <h2 class="step-title" data-i18n="step.amount"></h2>
        <div class="tier-grid" id="tier-grid"></div>
        <div class="tier-other" id="tier-other" hidden>
          <input class="input" id="tier-input" type="text" inputmode="numeric" autocomplete="off" data-i18n-aria="placeholder.customAmount" data-i18n-placeholder="placeholder.customAmount">
        </div>
        <p class="flow-summary__value" id="amount-chosen"><span id="amount-currency" data-cfg="content.donation.currency"></span> <span id="amount-number"></span></p>
        <div class="flow-nav">
          <button class="btn btn--ghost" type="button" id="flow-amount-back" data-i18n="flow.back"></button>
          <button class="btn btn--primary" type="button" id="flow-amount-next" data-i18n="flow.next" disabled></button>
        </div>
      </div>

      <div class="step-panel" data-panel="info" id="panel-info" hidden>
        <h2 class="step-title" data-i18n="step.info"></h2>
        <p class="pay-note" data-i18n="step.infoNote"></p>
        <form class="form-grid" id="details-form" novalidate>
          <div class="form-row">
            <label class="form-row__label" for="f-name" data-i18n="form.fullName"></label>
            <input class="input form-row__input" id="f-name" name="name" type="text" maxlength="120" autocomplete="name">
            <p class="form-row__error" id="err-name"></p>
          </div>
          <div class="form-row">
            <label class="form-row__label" for="f-email" data-i18n="form.email"></label>
            <input class="input form-row__input" id="f-email" name="email" type="email" maxlength="160" autocomplete="email" required>
            <p class="form-row__error" id="err-email"></p>
          </div>
          <div class="form-row">
            <label class="form-row__label" for="f-phone" data-i18n="form.phone"></label>
            <input class="input form-row__input" id="f-phone" name="phone" type="tel" maxlength="40" autocomplete="tel">
            <p class="form-row__error" id="err-phone"></p>
          </div>
          <div class="form-row">
            <label class="form-row__label" for="f-message" data-i18n="form.message"></label>
            <textarea class="input form-row__input" id="f-message" name="message" rows="4" maxlength="1000"></textarea>
            <p class="form-row__error" id="err-message"></p>
          </div>
          <div class="form-row form-row--wide">
            <label class="check-row" for="f-agree">
              <input type="checkbox" id="f-agree" name="agree" required>
              <span data-i18n="form.agree"></span>
            </label>
            <p class="form-row__error" id="err-agree"></p>
          </div>
          <p class="pay-note form-row--wide" id="form-privacy" data-i18n="form.privacy"></p>
          <div class="form-row form-row--wide">
            <label class="check-row" for="f-anonymous">
              <input type="checkbox" id="f-anonymous" name="anonymous">
              <span data-i18n="form.anonymous"></span>
            </label>
          </div>
          <p class="anon-note form-row--wide" id="form-anon-note" data-i18n="form.anonymousNote" hidden></p>
          <div class="hp-field" aria-hidden="true">
            <input id="f-hp" name="hp" type="text" tabindex="-1" autocomplete="off">
          </div>
        </form>
        <div class="flow-nav">
          <button class="btn btn--ghost" type="button" id="flow-info-back" data-i18n="flow.back"></button>
          <button class="btn btn--primary" type="button" id="flow-info-next" data-i18n="flow.next"></button>
        </div>
        <p class="status status--idle form-row--wide" id="form-status" role="status" aria-live="polite"></p>
      </div>

      <div class="step-panel" data-panel="pay" id="panel-pay" hidden>
        <h2 class="step-title" data-i18n="step.pay"></h2>
        <div class="flow-summary">
          <div class="flow-summary__row">
            <span data-i18n="pay.methodLabel"></span>
            <span id="pay-method-name"></span>
          </div>
          <div class="flow-summary__row">
            <span data-i18n="donatePage.amountLabel"></span>
            <span id="pay-amount"><span id="pay-currency"></span> <span id="pay-amount-number"></span></span>
          </div>
        </div>

        <div class="pay-panel" id="pay-qr" hidden>
          <div class="qr-slot" data-cfg-img="content.donation.qrImage" data-ph-size="400x400"></div>
          <p class="qr-caption" data-cfg="content.donation.qrCaption"></p>
          <p class="ewallet-name" data-cfg="content.donation.ewalletName"></p>
        </div>

        <div class="pay-panel" id="pay-hosted" hidden>
          <p class="pay-note" data-cfg="content.donation.onlineLabel"></p>
          <a class="btn btn--primary btn--block" id="hosted-link" aria-disabled="true" tabindex="-1" data-i18n="pay.hostedCta"></a>
          <p class="qr-caption" id="hosted-unavailable" data-i18n="pay.hostedUnavailable"></p>
        </div>

        <div class="pay-panel" id="pay-bank" hidden>
          <div class="bank-table">
            <div class="bank-row">
              <span class="bank-label" data-i18n="otherWays.bankName"></span>
              <span class="bank-value" data-cfg="content.donation.bankName"></span>
            </div>
            <div class="bank-row">
              <span class="bank-label" data-i18n="otherWays.accountName"></span>
              <span class="bank-value" data-cfg="content.donation.accountName"></span>
            </div>
            <div class="bank-row">
              <span class="bank-label" data-i18n="otherWays.accountNo"></span>
              <span class="bank-value" data-cfg="content.donation.accountNumber"></span>
            </div>
            <div class="bank-row">
              <span class="bank-label" data-i18n="otherWays.swift"></span>
              <span class="bank-value" data-cfg="content.donation.swift"></span>
            </div>
            <div class="bank-row">
              <span aria-hidden="true"></span>
              <button class="copy-btn" type="button" id="copy-account" data-i18n="otherWays.copy" disabled></button>
            </div>
          </div>
          <p class="pay-note" data-i18n="pay.afterNote"></p>
        </div>

        <div class="flow-nav">
          <button class="btn btn--ghost" type="button" id="flow-pay-back" data-i18n="flow.back"></button>
          <button class="btn btn--primary" type="button" id="flow-pay-done" data-i18n="pay.paidCta"></button>
        </div>
      </div>

      <div class="step-panel" data-panel="done" id="panel-done" hidden>
        <div class="done-card">
          <h2 class="done-card__title" data-i18n="done.title"></h2>
          <p class="done-card__body" data-i18n="done.body"></p>
          <p class="status status--err" id="done-note" role="status" hidden></p>
          <div class="flow-nav">
            <a class="btn btn--primary" href="index.html" data-i18n="done.home"></a>
            <a class="btn btn--ghost" href="contact.html" data-i18n="done.contact"></a>
          </div>
        </div>
      </div>

    </div>
  </section>

  <div class="shell">
    <div class="contact-strip">
      <p class="contact-strip__items">
        <strong data-i18n="contactPage.questions"></strong>
        <span data-cfg="org.phone"></span>
        <span data-cfg="org.whatsapp"></span>
        <span data-cfg="org.email"></span>
      </p>
      <a class="btn btn--ghost" href="contact.html" data-i18n="contactPage.fullPage"></a>
    </div>
  </div>

</main>

<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/donate.js"></script>
</body>
</html>
