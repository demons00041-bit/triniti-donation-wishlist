<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1622" media="(prefers-color-scheme: dark)">
  <title>Contact us - Rumah Kanak-Kanak Triniti</title>
  <meta name="description" content="Address, phone, WhatsApp, email and visiting hours for Rumah Kanak-Kanak Triniti, with an open map link and the department to contact.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div id="site-header"></div>

  <main id="main" tabindex="-1">
    <div class="page-hero">
      <div class="shell">
        <h1 class="page-hero__title" data-i18n="contactPage.title"></h1>
        <p class="page-hero__subtitle ph ph--text" data-cfg="content.contactPage.subtitle"></p>
      </div>
    </div>

    <section class="section">
      <div class="shell">
        <dl class="contact-list">
          <div class="contact-item">
            <dt class="contact-item__label" data-i18n="contactPage.address"></dt>
            <dd class="contact-item__value ph ph--text" data-cfg="org.address"></dd>
          </div>
          <div class="contact-item">
            <dt class="contact-item__label" data-i18n="contactPage.phone"></dt>
            <dd class="contact-item__value ph ph--text" data-cfg="org.phone"></dd>
          </div>
          <div class="contact-item">
            <dt class="contact-item__label" data-i18n="contactPage.whatsapp"></dt>
            <dd class="contact-item__value ph ph--text" data-cfg="org.whatsapp"></dd>
          </div>
          <div class="contact-item">
            <dt class="contact-item__label" data-i18n="contactPage.email"></dt>
            <dd class="contact-item__value ph ph--text" data-cfg="org.email"></dd>
          </div>
          <div class="contact-item">
            <dt class="contact-item__label" data-i18n="contactPage.hours"></dt>
            <dd class="contact-item__value ph ph--text" data-cfg="org.hours"></dd>
          </div>
        </dl>
        <p>
          <a class="btn btn--ghost" data-cfg-href="org.mapsUrl" data-i18n="otherWays.map"></a>
        </p>
      </div>
    </section>

    <section class="section">
      <div class="shell">
        <div class="map-slot ph ph--image" data-cfg-img="content.contactPage.mapImage" data-cfg-alt="content.contactPage.mapAlt" data-ph-size="1200x400"></div>
      </div>
    </section>

    <section class="section">
      <div class="shell">
        <div class="contact-table" role="table">
          <div class="contact-table__head" role="row">
            <span class="contact-table__cell" role="columnheader" data-i18n="contactPage.col1"></span>
            <span class="contact-table__cell" role="columnheader" data-i18n="contactPage.col2"></span>
            <span class="contact-table__cell" role="columnheader" data-i18n="contactPage.col3"></span>
          </div>
          <div class="contact-table__row" role="row">
            <span class="contact-table__cell ph ph--text" role="cell" data-cfg="content.contactPage.rows.0.a"></span>
            <span class="contact-table__cell ph ph--text" role="cell" data-cfg="content.contactPage.rows.0.b"></span>
            <span class="contact-table__cell ph ph--text" role="cell" data-cfg="content.contactPage.rows.0.c"></span>
          </div>
          <div class="contact-table__row" role="row">
            <span class="contact-table__cell ph ph--text" role="cell" data-cfg="content.contactPage.rows.1.a"></span>
            <span class="contact-table__cell ph ph--text" role="cell" data-cfg="content.contactPage.rows.1.b"></span>
            <span class="contact-table__cell ph ph--text" role="cell" data-cfg="content.contactPage.rows.1.c"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="shell">
        <div class="contact-strip">
          <p class="contact-strip__items" data-i18n="contactPage.questions"></p>
          <a class="btn btn--primary" href="donate.html" data-i18n="nav.donate"></a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
