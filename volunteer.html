<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1622" media="(prefers-color-scheme: dark)">
  <title>Volunteer with us - Rumah Kanak-Kanak Triniti</title>
  <meta name="description" content="Three ways to volunteer with Rumah Kanak-Kanak Triniti: help at the home, share a skill, or help from a distance.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="volunteer">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div id="site-header"></div>

  <main id="main" tabindex="-1">
    <div class="page-hero">
      <div class="shell">
        <h1 class="page-hero__title" data-i18n="volunteer.title"></h1>
        <p class="page-hero__subtitle ph ph--text" data-cfg="content.volunteer.subtitle"></p>
      </div>
    </div>

    <section class="section">
      <div class="shell">
        <div class="split">
          <div class="split__media">
            <div class="ph ph--image" data-cfg-img="content.volunteer.image" data-cfg-alt="content.volunteer.imageAlt" data-ph-size="800x600"></div>
          </div>
          <div class="split__body">
            <p class="ph ph--text" data-cfg="content.volunteer.body1"></p>
            <p class="ph ph--text" data-cfg="content.volunteer.body2"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="shell">
        <div class="roles">
          <article class="role-card">
            <div class="ph ph--image" data-cfg-img="content.volunteer.roles.0.icon" data-ph-size="48x48"></div>
            <h2 class="role-card__title" data-i18n="volunteer.role1"></h2>
            <p class="role-card__body ph ph--text" data-cfg="content.volunteer.roles.0.body"></p>
            <p class="role-card__commitment ph ph--text" data-cfg="content.volunteer.roles.0.commitment"></p>
          </article>
          <article class="role-card">
            <div class="ph ph--image" data-cfg-img="content.volunteer.roles.1.icon" data-ph-size="48x48"></div>
            <h2 class="role-card__title" data-i18n="volunteer.role2"></h2>
            <p class="role-card__body ph ph--text" data-cfg="content.volunteer.roles.1.body"></p>
            <p class="role-card__commitment ph ph--text" data-cfg="content.volunteer.roles.1.commitment"></p>
          </article>
          <article class="role-card">
            <div class="ph ph--image" data-cfg-img="content.volunteer.roles.2.icon" data-ph-size="48x48"></div>
            <h2 class="role-card__title" data-i18n="volunteer.role3"></h2>
            <p class="role-card__body ph ph--text" data-cfg="content.volunteer.roles.2.body"></p>
            <p class="role-card__commitment ph ph--text" data-cfg="content.volunteer.roles.2.commitment"></p>
          </article>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="shell">
        <div class="steps">
          <div class="step">
            <span class="step__num" aria-hidden="true">1</span>
            <h2 class="step__title" data-i18n="volunteer.step1"></h2>
            <p class="step__body ph ph--text" data-cfg="content.volunteer.steps.0"></p>
          </div>
          <div class="step">
            <span class="step__num" aria-hidden="true">2</span>
            <h2 class="step__title" data-i18n="volunteer.step2"></h2>
            <p class="step__body ph ph--text" data-cfg="content.volunteer.steps.1"></p>
          </div>
          <div class="step">
            <span class="step__num" aria-hidden="true">3</span>
            <h2 class="step__title" data-i18n="volunteer.step3"></h2>
            <p class="step__body ph ph--text" data-cfg="content.volunteer.steps.2"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="shell">
        <div class="cta-band">
          <p class="cta-band__line ph ph--text" data-cfg="content.volunteer.ctaLine"></p>
          <a class="btn btn--primary" href="contact.html" data-i18n="volunteer.ctaButton"></a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
